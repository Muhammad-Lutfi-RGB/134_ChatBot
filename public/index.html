<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-wrapper">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-info">
        <span class="status-dot"></span>
        <div>
          <h1>AI Assistant</h1>
          <p>Online • Siap membantu</p>
        </div>
      </div>
      <button id="clear-btn" class="icon-btn" title="Hapus obrolan" aria-label="Hapus obrolan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/>
        </svg>
      </button>
    </header>

    <!-- Area Pesan -->
    <main id="chat-box" class="chat-box">
      <div class="message bot">
        <div class="bubble">Halo! Ada yang bisa saya bantu hari ini?</div>
      </div>
    </main>

    <!-- Area Input -->
    <footer class="chat-footer">
      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Ketik pesan di sini..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn" aria-label="Kirim pesan">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
